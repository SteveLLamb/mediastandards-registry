name: PR Build Preview (MSRBot.io site)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      # Manual PRs that touch site or templates
      - "src/site/**"
      - "src/main/config/**"
      - "src/main/lib/**"
      - "src/main/templates/**"
      - "tools/**" 
      - "package.json"
      - "package-lock.json"
      # Extract PRs (bot): include because they change the dataset used by the site
      - "src/main/data/**"
      # MSI/MRI PRs: include to trigger previews for report changes
      - "src/main/reports/**"

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: pages-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    if: >
      (
        github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name == github.repository
        && !startsWith(github.head_ref, 'gh-pages')
      )
    runs-on: ubuntu-latest
    env:
      KEYWORD_VALIDATION_MODE: warn
    steps:
      - name: Mint PrZ3 Unit token
        id: app-token
        if: github.actor != 'dependabot[bot]'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.app-token.outputs.token || github.token }}

      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "npm"

      - run: npm ci

      - name: Canonicalize data (sanity)
        run: npm run canonicalize

      - name: Validate dataset
        run: npm run validate

      - name: Build site preview
        run: npm run build   # produces ./build (includes build/api/stats.json)

      - name: Verify build output exists
        run: |
          if [ ! -d build ]; then
            echo "::error::No build/ output directory found after 'npm run build'.";
            echo "Contents of repo root:";
            ls -la;
            echo "\nLikely build output directories in top 2 levels:";
            find . -maxdepth 2 -type d -name "*dist*" -o -name "*build*" -o -name "*public*";
            exit 1;
          fi

      - name: Deploy PR preview to gh-pages/pr/<PR#>
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          set -e
          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

          git clone --single-branch --branch gh-pages --depth 1 "$REPO_URL" _ghp
          cd _ghp
          git config user.name "PrZ3 Unit"
          git config user.email "prz3-unit[bot]@users.noreply.github.com"

          rm -rf "pr/${PR_NUM}"
          mkdir -p "pr/${PR_NUM}"
          cp -r "$GITHUB_WORKSPACE/build/." "pr/${PR_NUM}/"

          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy."
            exit 0
          fi

          git commit -m "deploy preview for PR #${PR_NUM} (PrZ3 Unit)"

          for attempt in 1 2 3; do
            if git push origin gh-pages; then
              echo "✅ Preview deployed (attempt ${attempt})"
              exit 0
            fi
            echo "⚠️ Push failed (attempt ${attempt}/3), rebasing on latest gh-pages…"
            git pull --rebase origin gh-pages
          done
          echo "::error::Failed to deploy preview after 3 attempts"
          exit 1

      - name: Comment preview URL on PR
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          header: msr-preview
          number: ${{ github.event.pull_request.number }}
          message: |
            # Review link
            [MSRBot.io Build Preview](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr/${{ github.event.pull_request.number }}/)
            _This link updates on new commits to this PR._ 
