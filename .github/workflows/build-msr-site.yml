name: Build MSRBot.io Site and Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write 

concurrency:
  group: build-main
  cancel-in-progress: false

jobs:
  build:
    name: Build MSR
    runs-on: ubuntu-latest
    env:
      CI: true

    steps:
      - name: Mint PrZ3 Unit token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Validate registries
        run: npm run validate

      - name: Canonicalize registries (sanity check)
        run: |
          npm run canonicalize
          if git diff --quiet -- src/main/data; then
            echo "No canonicalization changes."
          else
            echo "::warning::Canonicalize produced local changes during site build (not auto-committing on main build workflow)."
            git status --short src/main/data || true
          fi

      - name: Build site
        env:
          GH_PAGES_BUILD: true
        run: npm run build

      - name: Deploy to gh-pages (cleanup + publish, atomic)
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

          git clone --single-branch --branch gh-pages --depth 1 "$REPO_URL" _ghp
          cd _ghp
          git config user.name "PrZ3 Unit"
          git config user.email "prz3-unit[bot]@users.noreply.github.com"

          shopt -s dotglob
          for entry in * .[^.]*; do
            case "$entry" in
              .|..|.git|.gitignore|.gitattributes|.github) continue ;;
              pr|CNAME|.nojekyll) continue ;;
              *) rm -rf "$entry" ;;
            esac
          done

          cp -r "$GITHUB_WORKSPACE/build/." .
          echo "msrbot.io" > CNAME
          touch .nojekyll

          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy."
            exit 0
          fi

          git commit -m "deploy: ${{ github.sha }} (PrZ3 Unit)"

          for attempt in 1 2 3; do
            if git push origin gh-pages; then
              echo "✅ Site deployed (attempt ${attempt})"
              exit 0
            fi
            echo "⚠️ Push failed (attempt ${attempt}/3), rebasing on latest gh-pages…"
            git pull --rebase origin gh-pages
          done
          echo "::error::Failed to deploy site after 3 attempts"
          exit 1
